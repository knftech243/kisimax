services:
  db:
    image: postgres:16-alpine
    container_name: kisimax_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kisimax
      POSTGRES_PASSWORD: kisimax
      POSTGRES_DB: kisimax_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kisimax_dev_pgdata:/var/lib/postgresql/data

volumes:
  kisimax_dev_pgdata:
